[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "minirepair"
version = "0.1.0"
description = "MiniRepair-RL: RL for Test-Verifiable Code Repair Agents"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "tqdm",
    "pyyaml",
    "jsonlines",
    "pydantic>=2.0",
    "typing-extensions",
    "rich",
    "pytest",
    "pytest-timeout",
    "matplotlib",
    "tabulate",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "coverage",
]
train = [
    "transformers",
    "accelerate",
    "datasets",
    "safetensors",
    "tokenizers",
    "sentencepiece",
    "peft",
    "trl",
    "modelscope",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["minirepair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
